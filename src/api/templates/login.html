{% extends "base.html" %}

{% block title %}Sign in · Race Planner{% endblock %}
{% block page_class %}page-narrow{% endblock %}

{% block content %}
<div class="auth">
    <h1>Sign in</h1>
    <p class="sub">Welcome back.</p>
    {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="card stack">
        <div class="field">
            <label for="email">Email</label>
            <input class="input" type="email" id="email" name="username" required autocomplete="email" autofocus>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input class="input" type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
    <p class="auth-foot">New here? <a href="/register">Create an account</a></p>
</div>
{% endblock %}
