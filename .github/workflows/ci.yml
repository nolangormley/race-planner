name: CI

# Runs the test suite on every push/PR. Safe to run unattended: the tests
# under tests/ (see pyproject.toml's testpaths) are pure/mocked and make no
# network calls or billed API requests. The three scripts that DO call real
# LLM APIs live under scripts/manual_check_*.py specifically so they're
# never picked up by pytest collection — see
# agent_prompting/improvement_plan.md Section 5.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  # Server side of the deploy lives in deploy/ (see deploy/AGENTS.md).
  # Browser tests against the real app with a fake Strava (see e2e/AGENTS.md).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raceplanner_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser tests
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raceplanner_e2e
        run: pytest e2e -q

  deploy:
    needs: [test, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to yasmodeus
        run: git archive --format=tar.gz HEAD | ssh -o BatchMode=yes raceplanner@yasmodeus.andrew.cmu.edu
