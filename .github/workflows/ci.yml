name: CI

# Runs the test suite on every push/PR. Safe to run unattended: the tests
# under tests/ (see pyproject.toml's testpaths) are pure/mocked and make no
# network calls or billed API requests. The three scripts that DO call real
# LLM APIs live under scripts/manual_check_*.py specifically so they're
# never picked up by pytest collection — see
# agent_prompting/improvement_plan.md Section 5.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
